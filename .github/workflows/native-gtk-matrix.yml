name: Native GTK4 compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Runtime combinations to execute
        type: choice
        default: windows-legacy
        options:
          - windows-legacy
          - all

permissions:
  contents: read

jobs:
  gtk-runtime:
    name: GTK ${{ matrix.gtk }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os == 'linux-x86_64' && 'ubuntu-24.04' || matrix.os == 'windows-x86_64' && 'windows-2022' || 'macos-14' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        os: ${{ fromJSON(inputs.scope == 'windows-legacy' && '["windows-x86_64"]' || '["linux-x86_64", "windows-x86_64", "macos-arm64"]') }}
        gtk: ${{ fromJSON(inputs.scope == 'windows-legacy' && '["4.8", "4.10"]' || '["4.8", "4.10", "4.12", "4.14", "4.16", "4.18", "4.20", "4.22", "4.24"]') }}
        # These exclusions describe missing conda-forge binaries for the
        # requested runner architecture, not GTK upstream/platform support.
        # GTK 4.16/4.18 have no conda-forge builds on any platform; GTK 4.8
        # and 4.10 have osx-64 builds but no osx-arm64 builds. Keep all such
        # cells NOT TESTED and add another native provider before claiming
        # those GTK/platform combinations.
        exclude:
          - os: linux-x86_64
            gtk: "4.16"
          - os: linux-x86_64
            gtk: "4.18"
          - os: windows-x86_64
            gtk: "4.16"
          - os: windows-x86_64
            gtk: "4.18"
          - os: macos-arm64
            gtk: "4.8"
          - os: macos-arm64
            gtk: "4.10"
          - os: macos-arm64
            gtk: "4.16"
          - os: macos-arm64
            gtk: "4.18"

    defaults:
      run:
        shell: bash {0}

    steps:
      - uses: actions/checkout@v5

      - name: Initialize per-platform test evidence
        run: |
          printf 'GTK_REQUESTED=%s OS=%s STATUS=SETUP_PENDING\n' \
            '${{ matrix.gtk }}' '${{ matrix.os }}' > platform-results.txt

      - name: Install Linux native display and software GL support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri

      - name: Create GTK runtime
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: easyhybrid-gtk
          cache-environment: true
          init-shell: none
          post-cleanup: none
          # GTK 4.8/4.10 on Windows need the matched, known-good GLib 2.78.4
          # h16e383f_0 / glib-tools h12be248_0 pair. Newer GTK cells use
          # newer GLib builds; do not apply this compatibility pin globally.
          create-args: >-
            python=3.12
            gtk4=${{ matrix.gtk }}.*
            ${{ matrix.gtk == '4.8' && 'jpeg=9e' || '' }}
            ${{ matrix.os == 'windows-x86_64' && (matrix.gtk == '4.8' || matrix.gtk == '4.10') && 'libglib=2.78.4=h16e383f_0 glib-tools=2.78.4=h12be248_0 libiconv=1.17 --skip-run-link-scripts' || '' }}
            pygobject
            pycairo
            pytest
            pyopengl

      - name: Diagnose and generate Windows gdk-pixbuf loader cache
        if: runner.os == 'Windows' && (matrix.gtk == '4.8' || matrix.gtk == '4.10')
        shell: pwsh
        run: |
          $prefix = (micromamba run -n easyhybrid-gtk python -c 'import sys; print(sys.prefix)' |
            Select-Object -Last 1).Trim()
          $queryLoaders = Join-Path $prefix 'Library\bin\gdk-pixbuf-query-loaders.exe'
          if (-not (Test-Path $queryLoaders)) {
            throw "gdk-pixbuf-query-loaders was not installed at $queryLoaders"
          }

          $stdout = Join-Path $env:RUNNER_TEMP 'gdk-pixbuf-query-loaders.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'gdk-pixbuf-query-loaders.stderr.txt'
          $process = Start-Process -FilePath $queryLoaders -ArgumentList '--update-cache' `
            -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw 'gdk-pixbuf-query-loaders timed out after 60 seconds; see captured output.'
          }
          if ($process.ExitCode -ne 0) {
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw "gdk-pixbuf-query-loaders failed with exit code $($process.ExitCode)."
          }
          Write-Output "gdk-pixbuf loader cache generated successfully (exit $($process.ExitCode))."

      - name: Install pinned Mesa WGL software renderer for Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.4-release-msvc.7z'
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          $expectedSha256 = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Mesa archive SHA-256 mismatch: $actualSha256"
          }

          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          }
          if (-not (Test-Path $sevenZip)) {
            throw '7-Zip is required to extract the pinned Mesa runtime.'
          }
          $extractDir = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.4'
          & $sevenZip x $archive "-o$extractDir" -y
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip extraction failed with exit code $LASTEXITCODE"
          }

          $mesaDir = Get-ChildItem -Path $extractDir -Directory -Filter x64 -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $mesaDir) {
            throw 'The pinned Mesa archive contains no x64 runtime directory.'
          }
          $pythonExe = (micromamba run -n easyhybrid-gtk python -c 'import sys; print(sys.executable)' |
            Select-Object -Last 1).Trim()
          $appDir = Split-Path -Parent $pythonExe
          foreach ($dll in @('opengl32.dll', 'libgallium_wgl.dll')) {
            $source = Join-Path $mesaDir $dll
            if (-not (Test-Path $source)) {
              throw "Required Mesa WGL file is missing: $source"
            }
            Copy-Item -Path $source -Destination $appDir -Force
          }
          Write-Output "Pinned Mesa WGL llvmpipe runtime deployed beside $pythonExe"

      - name: Install full regression dependencies
        if: matrix.gtk == '4.24'
        run: >-
          micromamba install --yes -n easyhybrid-gtk --channel conda-forge
          numpy scipy cython pillow freetype-py psutil pyyaml

      - name: Record actual runtime and host
        run: |
          set -o pipefail
          micromamba run -n easyhybrid-gtk python - <<'PY' | tee -a platform-results.txt
          import gi
          import platform
          gi.require_version('GdkPixbuf', '2.0')
          gi.require_version('Gtk', '4.0')
          from gi.repository import GdkPixbuf, GLib, Gtk

          gtk_version = ".".join(
              map(str, (Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version()))
          )
          glib_version = ".".join(
              map(str, (GLib.MAJOR_VERSION, GLib.MINOR_VERSION, GLib.MICRO_VERSION))
          )
          pygobject_version = ".".join(map(str, gi.version_info))
          print(
              f"OS={platform.platform()} ARCH={platform.machine()} "
              f"PYTHON={platform.python_version()} PYGOBJECT={pygobject_version} "
              f"GTK={gtk_version} GLIB={glib_version} GDK_PIXBUF_API=2.0 (imported)"
          )
          PY

      - name: Diagnose WGL DLL resolution for GTK 4.8/4.10 on Windows
        if: runner.os == 'Windows' && (matrix.gtk == '4.8' || matrix.gtk == '4.10')
        run: |
          set -o pipefail
          GALLIUM_DRIVER=llvmpipe LIBGL_DEBUG=verbose micromamba run -n easyhybrid-gtk python - <<'PY' | tee -a platform-results.txt
          import ctypes
          import pathlib
          import sys
          import gi

          gi.require_version('Gtk', '4.0')
          from gi.repository import Gtk

          kernel32 = ctypes.WinDLL('kernel32', use_last_error=True)
          kernel32.GetModuleHandleW.argtypes = [ctypes.c_wchar_p]
          kernel32.GetModuleHandleW.restype = ctypes.c_void_p
          kernel32.GetModuleFileNameW.argtypes = [ctypes.c_void_p, ctypes.c_wchar_p, ctypes.c_uint32]
          kernel32.GetModuleFileNameW.restype = ctypes.c_uint32
          app_dir = pathlib.Path(sys.executable).parent

          def module_path(handle):
              buffer = ctypes.create_unicode_buffer(32768)
              length = kernel32.GetModuleFileNameW(handle, buffer, len(buffer))
              return buffer.value if length else f'<unresolved: winerror={ctypes.get_last_error()}>'

          try:
              opengl = ctypes.WinDLL('opengl32.dll', use_last_error=True)
              opengl_handle = kernel32.GetModuleHandleW('opengl32.dll')
              print(f'OPENGL32_LOADED={module_path(opengl_handle)}')
              for symbol in ('wglCreateContext', 'wglMakeCurrent'):
                  try:
                      getattr(opengl, symbol)
                      print(f'OPENGL32_EXPORT_{symbol}=available')
                  except AttributeError:
                      print(f'OPENGL32_EXPORT_{symbol}=unavailable')
          except OSError as error:
              print(f'OPENGL32_LOAD_FAILED={error}')

          mesa_wgl = app_dir / 'libgallium_wgl.dll'
          try:
              ctypes.WinDLL(str(mesa_wgl), use_last_error=True)
              print(f'MESA_WGL_LOAD=PASS path={mesa_wgl}')
          except OSError as error:
              print(f'MESA_WGL_LOAD=FAIL path={mesa_wgl} error={error}')

          # Probe the WGL stack independently of GTK so a successful DLL load
          # cannot be mistaken for a working OpenGL context.
          import tkinter
          user32 = ctypes.WinDLL('user32', use_last_error=True)
          gdi32 = ctypes.WinDLL('gdi32', use_last_error=True)

          class PixelFormatDescriptor(ctypes.Structure):
              _fields_ = [
                  ('nSize', ctypes.c_ushort), ('nVersion', ctypes.c_ushort),
                  ('dwFlags', ctypes.c_uint32), ('iPixelType', ctypes.c_ubyte),
                  ('cColorBits', ctypes.c_ubyte), ('cRedBits', ctypes.c_ubyte),
                  ('cRedShift', ctypes.c_ubyte), ('cGreenBits', ctypes.c_ubyte),
                  ('cGreenShift', ctypes.c_ubyte), ('cBlueBits', ctypes.c_ubyte),
                  ('cBlueShift', ctypes.c_ubyte), ('cAlphaBits', ctypes.c_ubyte),
                  ('cAlphaShift', ctypes.c_ubyte), ('cAccumBits', ctypes.c_ubyte),
                  ('cAccumRedBits', ctypes.c_ubyte), ('cAccumGreenBits', ctypes.c_ubyte),
                  ('cAccumBlueBits', ctypes.c_ubyte), ('cAccumAlphaBits', ctypes.c_ubyte),
                  ('cDepthBits', ctypes.c_ubyte), ('cStencilBits', ctypes.c_ubyte),
                  ('cAuxBuffers', ctypes.c_ubyte), ('iLayerType', ctypes.c_byte),
                  ('bReserved', ctypes.c_ubyte), ('dwLayerMask', ctypes.c_uint32),
                  ('dwVisibleMask', ctypes.c_uint32), ('dwDamageMask', ctypes.c_uint32),
              ]

          root = tkinter.Tk()
          root.geometry('1x1+0+0')
          root.update()
          hwnd = root.winfo_id()
          user32.GetDC.argtypes = [ctypes.c_void_p]
          user32.GetDC.restype = ctypes.c_void_p
          gdi32.ChoosePixelFormat.argtypes = [ctypes.c_void_p, ctypes.POINTER(PixelFormatDescriptor)]
          gdi32.ChoosePixelFormat.restype = ctypes.c_int
          gdi32.SetPixelFormat.argtypes = [ctypes.c_void_p, ctypes.c_int, ctypes.POINTER(PixelFormatDescriptor)]
          gdi32.SetPixelFormat.restype = ctypes.c_int
          hdc = user32.GetDC(hwnd)
          pfd = PixelFormatDescriptor()
          pfd.nSize = ctypes.sizeof(PixelFormatDescriptor)
          pfd.nVersion = 1
          pfd.dwFlags = 0x00000004 | 0x00000020 | 0x00000001
          pfd.iPixelType = 0
          pfd.cColorBits = 32
          pfd.cAlphaBits = 8
          pfd.iLayerType = 0
          pixel_format = gdi32.ChoosePixelFormat(hdc, ctypes.byref(pfd))
          if not pixel_format:
              print(f'BASIC_WGL_CHOOSE_PIXEL_FORMAT=FAIL winerror={ctypes.get_last_error()}')
          elif not gdi32.SetPixelFormat(hdc, pixel_format, ctypes.byref(pfd)):
              print(f'BASIC_WGL_SET_PIXEL_FORMAT=FAIL winerror={ctypes.get_last_error()}')
          else:
              opengl.wglCreateContext.argtypes = [ctypes.c_void_p]
              opengl.wglCreateContext.restype = ctypes.c_void_p
              opengl.wglMakeCurrent.argtypes = [ctypes.c_void_p, ctypes.c_void_p]
              opengl.wglMakeCurrent.restype = ctypes.c_int
              opengl.wglDeleteContext.argtypes = [ctypes.c_void_p]
              opengl.wglDeleteContext.restype = ctypes.c_int
              context = opengl.wglCreateContext(hdc)
              if not context:
                  print(f'BASIC_WGL_CREATE_CONTEXT=FAIL winerror={ctypes.get_last_error()}')
              elif not opengl.wglMakeCurrent(hdc, context):
                  print(f'BASIC_WGL_MAKE_CURRENT=FAIL winerror={ctypes.get_last_error()}')
              else:
                  opengl.glGetString.argtypes = [ctypes.c_uint]
                  opengl.glGetString.restype = ctypes.c_char_p
                  print(f'BASIC_WGL_VERSION={opengl.glGetString(0x1F02)!r}')
                  print(f'BASIC_WGL_RENDERER={opengl.glGetString(0x1F01)!r}')
                  opengl.wglMakeCurrent(None, None)
                  opengl.wglDeleteContext(context)
          root.destroy()

          print(
              f'GTK={Gtk.get_major_version()}.{Gtk.get_minor_version()}.{Gtk.get_micro_version()} '
              f'PYTHON_EXE={sys.executable} APP_LOCAL_OPENGL32={(app_dir / "opengl32.dll").exists()}'
          )
          PY

      - name: Trace actual GTK WGL bootstrap on older Windows runtimes
        if: runner.os == 'Windows' && (matrix.gtk == '4.8' || matrix.gtk == '4.10')
        continue-on-error: true
        run: |
          set -o pipefail
          micromamba run -n easyhybrid-gtk python -m pip install frida==17.2.17
          GALLIUM_DRIVER=llvmpipe micromamba run -n easyhybrid-gtk python tests/diagnostics/trace_windows_wgl.py 2>&1 | tee -a platform-results.txt

      - name: Run native GTK window, Gio action, and real GLArea smoke
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe PYOPENGL_PLATFORM=glx xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" micromamba run -n easyhybrid-gtk python tests/test_gtk_icon_theme_smoke.py 2>&1 | tee -a platform-results.txt
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            GALLIUM_DRIVER=llvmpipe micromamba run -n easyhybrid-gtk python tests/test_gtk_icon_theme_smoke.py 2>&1 | tee -a platform-results.txt
          else
            micromamba run -n easyhybrid-gtk python tests/test_gtk_icon_theme_smoke.py 2>&1 | tee -a platform-results.txt
          fi

      - name: Build graphics engine extensions
        if: matrix.gtk == '4.24'
        run: micromamba run -n easyhybrid-gtk python setup.py build_ext --inplace
        working-directory: src/graphics_engine

      - name: Run complete regression suite with real GTK smoke enabled
        if: matrix.gtk == '4.24'
        env:
          EASYHYBRID_RUN_GTK_GUI_TESTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe PYOPENGL_PLATFORM=glx xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" micromamba run -n easyhybrid-gtk python -m pytest -q -p no:cacheprovider tests/ 2>&1 | tee -a platform-results.txt
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            GALLIUM_DRIVER=llvmpipe micromamba run -n easyhybrid-gtk python -m pytest -q -p no:cacheprovider tests/ 2>&1 | tee -a platform-results.txt
          else
            micromamba run -n easyhybrid-gtk python -m pytest -q -p no:cacheprovider tests/ 2>&1 | tee -a platform-results.txt
          fi

      - name: Upload runtime and test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gtk-${{ matrix.gtk }}-${{ matrix.os }}-results
          path: platform-results.txt
          if-no-files-found: warn
