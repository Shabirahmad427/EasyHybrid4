name: Native GTK4 compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Runtime combinations to execute
        type: choice
        default: all
        options:
          - all
          - windows-legacy
          - macos-diagnostic
          - macos-gtk424
          - windows

permissions:
  contents: read

env:
  # Upstream pDynamo3 commit built in every cell for the full EasyHybrid
  # application regression (tests/test_easyhybrid_full_app_smoke.py).
  PDYNAMO3_REPOSITORY: pdynamo/pDynamo3
  PDYNAMO3_REF: 6b28dd8958e1a705fcdca130f4ab862a8af8de82

jobs:
  gtk-runtime:
    name: GTK ${{ matrix.gtk }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os == 'linux-x86_64' && 'ubuntu-24.04' || matrix.os == 'windows-x86_64' && 'windows-2022' || matrix.os == 'macos-x86_64' && 'macos-15-intel' || 'macos-14' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        os: ${{ fromJSON((inputs.scope == 'windows-legacy' || inputs.scope == 'windows') && '["windows-x86_64"]' || (inputs.scope == 'macos-diagnostic' || inputs.scope == 'macos-gtk424') && '["macos-arm64"]' || '["linux-x86_64", "windows-x86_64", "macos-arm64"]') }}
        gtk: ${{ fromJSON(inputs.scope == 'windows-legacy' && '["4.8", "4.10"]' || inputs.scope == 'macos-gtk424' && '["4.24"]' || '["4.8", "4.10", "4.12", "4.14", "4.16", "4.18", "4.20", "4.22", "4.24"]') }}
        # conda-forge publishes no GTK 4.16/4.18 builds, and GTK 4.8/4.10 only
        # for osx-64. Those cells are covered by the distro, MSYS2 and
        # source-build jobs below; GTK 4.8/4.10 also run here on Intel macOS.
        # Focused Windows dispatches must not also add Intel macOS cells.
        include: >-
          ${{ fromJSON((inputs.scope == 'windows' || inputs.scope == 'windows-legacy' || inputs.scope == 'macos-diagnostic' || inputs.scope == 'macos-gtk424') && '[]' || '[{"os": "macos-x86_64", "gtk": "4.8"}, {"os": "macos-x86_64", "gtk": "4.10"}]') }}
        exclude:
          - os: linux-x86_64
            gtk: "4.16"
          - os: linux-x86_64
            gtk: "4.18"
          - os: windows-x86_64
            gtk: "4.16"
          - os: windows-x86_64
            gtk: "4.18"
          - os: macos-arm64
            gtk: "4.8"
          - os: macos-arm64
            gtk: "4.10"
          - os: macos-arm64
            gtk: "4.16"
          - os: macos-arm64
            gtk: "4.18"

    defaults:
      run:
        shell: bash {0}

    steps:
      - uses: actions/checkout@v5

      - name: Initialize per-platform test evidence
        run: |
          printf 'GTK_REQUESTED=%s OS=%s STATUS=SETUP_PENDING\n' \
            '${{ matrix.gtk }}' '${{ matrix.os }}' > platform-results.txt

      - name: Install Linux native display and software GL support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri

      - name: Create GTK runtime
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          # Pin the installer itself: the action's unpinned latest lookup
          # transiently failed on 2026-10-19. Keep 2.9.0+: older releases
          # reject the Windows GTK 4.8/4.10 --skip-run-link-scripts flag.
          micromamba-version: 2.9.0-0
          environment-name: easyhybrid-gtk
          cache-environment: true
          init-shell: none
          post-cleanup: none
          # GTK 4.8/4.10 on Windows need the matched, known-good GLib 2.78.4
          # h16e383f_0 / glib-tools h12be248_0 pair. Newer GTK cells use
          # newer GLib builds; do not apply this compatibility pin globally.
          # Keep Pillow out of the conda solve: its libjpeg-turbo dependency
          # conflicts with GTK 4.8's legacy jpeg=9e requirement. Install it
          # after GTK has been resolved below.
          create-args: >-
            python=3.12
            gtk4=${{ matrix.gtk == '4.8' && '4.8.2' || matrix.gtk == '4.10' && '4.10.1' || matrix.gtk == '4.12' && '4.12.1' || matrix.gtk == '4.14' && '4.14.1' || matrix.gtk == '4.20' && '4.20.3' || matrix.gtk == '4.22' && '4.22.5' || '4.24.1' }}
            ${{ matrix.gtk == '4.8' && 'jpeg=9e' || '' }}
            ${{ matrix.os == 'windows-x86_64' && (matrix.gtk == '4.8' || matrix.gtk == '4.10') && 'libglib=2.78.4=h16e383f_0 glib-tools=2.78.4=h12be248_0 libiconv=1.17 --skip-run-link-scripts' || '' }}
            glib-tools
            pygobject
            pycairo
            pytest
            pyopengl

      - name: Compile GSettings schemas
        # GTK's file/colour choosers abort without a compiled schema cache.
        run: micromamba run -n easyhybrid-gtk python .github/scripts/compile_gsettings_schemas.py

      - name: Diagnose and generate Windows gdk-pixbuf loader cache
        if: runner.os == 'Windows' && (matrix.gtk == '4.8' || matrix.gtk == '4.10')
        shell: pwsh
        run: |
          $prefix = (micromamba run -n easyhybrid-gtk python -c 'import sys; print(sys.prefix)' |
            Select-Object -Last 1).Trim()
          $queryLoaders = Join-Path $prefix 'Library\bin\gdk-pixbuf-query-loaders.exe'
          if (-not (Test-Path $queryLoaders)) {
            throw "gdk-pixbuf-query-loaders was not installed at $queryLoaders"
          }

          $stdout = Join-Path $env:RUNNER_TEMP 'gdk-pixbuf-query-loaders.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'gdk-pixbuf-query-loaders.stderr.txt'
          $process = Start-Process -FilePath $queryLoaders -ArgumentList '--update-cache' `
            -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw 'gdk-pixbuf-query-loaders timed out after 60 seconds; see captured output.'
          }
          if ($process.ExitCode -ne 0) {
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw "gdk-pixbuf-query-loaders failed with exit code $($process.ExitCode)."
          }
          Write-Output "gdk-pixbuf loader cache generated successfully (exit $($process.ExitCode))."

      - name: Install pinned Mesa WGL software renderer for Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonExe = (micromamba run -n easyhybrid-gtk python -c 'import sys; print(sys.executable)' |
            Select-Object -Last 1).Trim()
          & .github/scripts/install_mesa_wgl.ps1 -PythonExe $pythonExe

      - name: Install graphics scene Python dependencies without changing GTK
        run: micromamba run -n easyhybrid-gtk python -m pip install --disable-pip-version-check numpy cython pillow freetype-py pyyaml setuptools

      - name: Install full-application dependencies
        # The full EasyHybrid application (with pDynamo3) imports SciPy and
        # psutil and now runs in every cell, not only the 4.24 full suite.
        run: micromamba run -n easyhybrid-gtk python -m pip install --disable-pip-version-check scipy psutil

      - name: Record actual runtime and host
        run: |
          set -o pipefail
          micromamba run -n easyhybrid-gtk python .github/scripts/record_runtime.py conda-forge '${{ matrix.gtk == '4.8' && '4.8.2' || matrix.gtk == '4.10' && '4.10.1' || matrix.gtk == '4.12' && '4.12.1' || matrix.gtk == '4.14' && '4.14.1' || matrix.gtk == '4.20' && '4.20.3' || matrix.gtk == '4.22' && '4.22.5' || '4.24.1' }}' | tee -a platform-results.txt

      - name: Run native GTK window, Gio action, and real GLArea smoke
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe PYOPENGL_PLATFORM=glx xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" micromamba run -n easyhybrid-gtk python tests/test_gtk_icon_theme_smoke.py 2>&1 | tee -a platform-results.txt
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            GALLIUM_DRIVER=llvmpipe micromamba run -n easyhybrid-gtk python tests/test_gtk_icon_theme_smoke.py 2>&1 | tee -a platform-results.txt
          else
            micromamba run -n easyhybrid-gtk python tests/test_gtk_icon_theme_smoke.py 2>&1 | tee -a platform-results.txt
          fi

      - name: Run GTK4 widget-pattern tests
        env:
          EASYHYBRID_REQUIRE_GTK_DISPLAY: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" micromamba run -n easyhybrid-gtk python -m pytest -q -p no:cacheprovider --noconftest -rs tests/test_gtk4_widget_patterns.py 2>&1 | tee -a platform-results.txt
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            GALLIUM_DRIVER=llvmpipe micromamba run -n easyhybrid-gtk python -m pytest -q -p no:cacheprovider --noconftest -rs tests/test_gtk4_widget_patterns.py 2>&1 | tee -a platform-results.txt
          else
            micromamba run -n easyhybrid-gtk python -m pytest -q -p no:cacheprovider --noconftest -rs tests/test_gtk4_widget_patterns.py 2>&1 | tee -a platform-results.txt
          fi

      - name: Reject native Windows fatal exceptions in GTK logs
        if: runner.os == 'Windows' && always()
        run: |
          if grep -Eq 'Windows fatal exception|unknown error ; error code 1073741819' platform-results.txt; then
            echo 'GTK emitted a native Windows fatal exception even though pytest may have exited successfully.'
            exit 1
          fi

      - name: Show macOS native crash report
        if: failure() && runner.os == 'macOS'
        run: python3 .github/scripts/show_macos_crash_report.py

      - name: Build graphics engine extensions
        run: micromamba run -n easyhybrid-gtk python setup.py build_ext --inplace
        working-directory: src/graphics_engine

      - name: Restore pDynamo3 build
        id: pdynamo3-cache
        uses: actions/cache@v4
        with:
          path: pDynamo3
          # One build per identical environment; saved only after a green job.
          key: pdynamo3-${{ env.PDYNAMO3_REF }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gtk }}-${{ matrix.distro || matrix.version || 'conda' }}-v12

      - name: Check out pinned pDynamo3
        if: steps.pdynamo3-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PDYNAMO3_REPOSITORY }}
          ref: ${{ env.PDYNAMO3_REF }}
          path: pDynamo3

      - name: Build pDynamo3
        run: |
          # This workflow's bash runs without -e: stop on a failed build.
          set -eo pipefail
          if [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "PDYNAMO3_BUILD=cached" | tee -a platform-results.txt
          fi
          [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" == "true" ]] || micromamba run -n easyhybrid-gtk python .github/scripts/patch_pdynamo3_windows.py pDynamo3 | tee -a platform-results.txt
          cd pDynamo3/installation
          if [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" != "true" ]]; then
            # Keep the whole log: compiler error cascades bury the first error.
            if ! micromamba run -n easyhybrid-gtk python Install.py -f -q > ../../pdynamo3-build.log 2>&1; then
              first=$(grep -m1 -nE "error C[0-9]+|error LNK[0-9]+|fatal error|: error:|^error: " ../../pdynamo3-build.log | cut -d: -f1)
              echo "== pDynamo3 build: context before the first error (line $first)"
              sed -n "$(( first > 25 ? first - 25 : 1 )),$(( first + 15 ))p" ../../pdynamo3-build.log
              echo "== last lines"; tail -25 ../../pdynamo3-build.log
              exit 1
            fi
            tail -5 ../../pdynamo3-build.log
          fi
          cd ../..
          export PDYNAMO3_HOME="${{ github.workspace }}/pDynamo3"
          export PDYNAMO3_PARAMETERS="$PDYNAMO3_HOME/parameters"
          export PDYNAMO3_SCRATCH="$RUNNER_TEMP"
          PYTHONPATH="$PDYNAMO3_HOME" micromamba run -n easyhybrid-gtk python -c "import pCore, pBabel, pMolecule, pScientific, pSimulation; print('PDYNAMO3_IMPORT=OK')" | tee -a platform-results.txt
          echo "PDYNAMO3_REF=$PDYNAMO3_REF" | tee -a platform-results.txt

      - name: Run the full EasyHybrid application with pDynamo3
        env:
          EASYHYBRID_RUN_FULL_APP_GRAPHICS: "1"
          EASYHYBRID_FULL_APP_CYCLES: "5"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          export PDYNAMO3_HOME="${{ github.workspace }}/pDynamo3"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" micromamba run -n easyhybrid-gtk python -m pytest -q -s -p no:cacheprovider tests/test_easyhybrid_full_app_smoke.py 2>&1 | tee -a platform-results.txt
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            GALLIUM_DRIVER=llvmpipe micromamba run -n easyhybrid-gtk python -m pytest -q -s -p no:cacheprovider tests/test_easyhybrid_full_app_smoke.py 2>&1 | tee -a platform-results.txt
          else
            micromamba run -n easyhybrid-gtk python -m pytest -q -s -p no:cacheprovider tests/test_easyhybrid_full_app_smoke.py 2>&1 | tee -a platform-results.txt
          fi

      - name: Run 5 EasyHybrid molecular scene pick and close cycles
        env:
          EASYHYBRID_RUN_GRAPHICS_TESTS: "1"
          EASYHYBRID_TEST_COORDINATE_PICKING: "1"
          EASYHYBRID_GRAPHICS_SMOKE_CYCLES: "5"
          EASYHYBRID_DEBUG_PICK: ${{ runner.os == 'macOS' && '1' || '0' }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" micromamba run -n easyhybrid-gtk python -m pytest -q -s -p no:cacheprovider tests/test_gtk_icon_theme_smoke.py::test_easyhybrid_menu_vismol_components_open_and_close_cleanly 2>&1 | tee -a platform-results.txt
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            GALLIUM_DRIVER=llvmpipe micromamba run -n easyhybrid-gtk python -m pytest -q -s -p no:cacheprovider tests/test_gtk_icon_theme_smoke.py::test_easyhybrid_menu_vismol_components_open_and_close_cleanly 2>&1 | tee -a platform-results.txt
          else
            micromamba run -n easyhybrid-gtk python -m pytest -q -s -p no:cacheprovider tests/test_gtk_icon_theme_smoke.py::test_easyhybrid_menu_vismol_components_open_and_close_cleanly 2>&1 | tee -a platform-results.txt
          fi

      - name: Run complete regression suite with real GTK smoke enabled
        if: matrix.gtk == '4.24'
        env:
          EASYHYBRID_RUN_GTK_GUI_TESTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe PYOPENGL_PLATFORM=glx xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" micromamba run -n easyhybrid-gtk python -m pytest -q -p no:cacheprovider --ignore=tests/test_gtk4_widget_patterns.py tests/ 2>&1 | tee -a platform-results.txt
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            GALLIUM_DRIVER=llvmpipe micromamba run -n easyhybrid-gtk python -m pytest -q -p no:cacheprovider --ignore=tests/test_gtk4_widget_patterns.py tests/ 2>&1 | tee -a platform-results.txt
          else
            micromamba run -n easyhybrid-gtk python -m pytest -q -p no:cacheprovider --ignore=tests/test_gtk4_widget_patterns.py tests/ 2>&1 | tee -a platform-results.txt
          fi

      - name: Validate VisMol rendering, export, picking and resize at scale 1 and 2
        env:
          EASYHYBRID_RUN_GRAPHICS_TESTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          # Xvfb honours GDK_SCALE=2; other backends record whether it applied.
          EASYHYBRID_REQUIRE_HIDPI_RENDER: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" micromamba run -n easyhybrid-gtk python -m pytest -q -s -p no:cacheprovider tests/test_vismol_render_validation.py 2>&1 | tee -a platform-results.txt
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            GALLIUM_DRIVER=llvmpipe micromamba run -n easyhybrid-gtk python -m pytest -q -s -p no:cacheprovider tests/test_vismol_render_validation.py 2>&1 | tee -a platform-results.txt
          else
            micromamba run -n easyhybrid-gtk python -m pytest -q -s -p no:cacheprovider tests/test_vismol_render_validation.py 2>&1 | tee -a platform-results.txt
          fi

      - name: Upload runtime and test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gtk-${{ matrix.gtk }}-${{ matrix.os }}-results
          path: platform-results.txt
          if-no-files-found: warn

  # GTK minors that conda-forge never published for Linux, taken from the
  # distribution release that shipped them. Ubuntu 24.10 and Fedora 41 are
  # end-of-life and served from their archives; Debian 13 is current stable.
  gtk-linux-distro:
    name: GTK ${{ matrix.gtk }} / linux-x86_64 (${{ matrix.distro }})
    if: inputs.scope != 'windows-legacy' && inputs.scope != 'macos-diagnostic' && inputs.scope != 'macos-gtk424' && inputs.scope != 'windows'
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - gtk: "4.16"
            distro: ubuntu-24.10
            family: debian
            image: ubuntu:24.10
            eol: true
          - gtk: "4.16"
            distro: fedora-41
            family: fedora
            image: fedora:41
            eol: true
          - gtk: "4.18"
            distro: debian-13
            family: debian
            image: debian:trixie
            eol: false

    defaults:
      run:
        shell: bash {0}

    steps:
      - name: Point end-of-life Ubuntu at old-releases
        if: matrix.eol && matrix.family == 'debian'
        run: |
          sed -i -E 's#https?://(archive|security)\.ubuntu\.com/ubuntu/?#http://old-releases.ubuntu.com/ubuntu/#g' \
            /etc/apt/sources.list.d/ubuntu.sources

      - name: Install Fedora GTK runtime and software GL from the archive
        if: matrix.family == 'fedora'
        run: |
          set -e
          rm -f /etc/yum.repos.d/fedora-cisco-openh264.repo
          sed -i -e 's|^metalink=|#metalink=|' \
            -e 's|^#baseurl=http://download.example/pub/fedora/linux|baseurl=https://archives.fedoraproject.org/pub/archive/fedora/linux|' \
            /etc/yum.repos.d/fedora*.repo
          dnf -y install git python3 python3-pip python3-gobject python3-cairo gtk4 \
            python3-pyopengl python3-pytest \
            python3-devel gcc xorg-x11-server-Xvfb xorg-x11-xauth \
            mesa-dri-drivers mesa-libEGL mesa-libGL which

      - name: Install distribution GTK runtime and software GL
        if: matrix.family == 'debian'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates git python3 python3-pip python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            python3-opengl python3-pytest python3-dev \
            build-essential xvfb xauth \
            libgl1 libgl1-mesa-dri libegl1 libegl-mesa0

      - name: Install graphics engine Python dependencies
        run: python3 -m pip install --user --break-system-packages setuptools numpy cython pillow freetype-py pyyaml scipy psutil

      - uses: actions/checkout@v5

      - name: Record actual runtime and host
        run: |
          set -o pipefail
          printf 'GTK_REQUESTED=%s OS=linux-x86_64 PROVIDER=%s\n' '${{ matrix.gtk }}' '${{ matrix.distro }}' > platform-results.txt
          python3 .github/scripts/record_runtime.py '${{ matrix.distro }}' '${{ matrix.gtk == '4.16' && matrix.distro == 'fedora-41' && '4.16.13' || matrix.gtk == '4.16' && '4.16.3' || '4.18.6' }}' | tee -a platform-results.txt

      - name: Build graphics engine extensions
        run: python3 setup.py build_ext --inplace
        working-directory: src/graphics_engine

      - name: Run native GTK window, Gio action, and real GLArea smoke
        run: |
          set -o pipefail
          # GTK 4.16+ renders through EGL on X11. Keep the application's own
          # PyOpenGL platform choice (EGL on Linux); forcing GLX loads libGL
          # and makes libepoxy look for a GLX context GTK never created.
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" python3 tests/test_gtk_icon_theme_smoke.py 2>&1 | tee -a platform-results.txt

      - name: Run GTK4 widget-pattern tests
        env:
          EASYHYBRID_REQUIRE_GTK_DISPLAY: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" python3 -m pytest -q -p no:cacheprovider --noconftest -rs tests/test_gtk4_widget_patterns.py 2>&1 | tee -a platform-results.txt

      - name: Restore pDynamo3 build
        id: pdynamo3-cache
        uses: actions/cache@v4
        with:
          path: pDynamo3
          # One build per identical environment; saved only after a green job.
          key: pdynamo3-${{ env.PDYNAMO3_REF }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gtk }}-${{ matrix.distro || matrix.version || 'conda' }}-v12

      - name: Check out pinned pDynamo3
        if: steps.pdynamo3-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PDYNAMO3_REPOSITORY }}
          ref: ${{ env.PDYNAMO3_REF }}
          path: pDynamo3

      - name: Build pDynamo3
        run: |
          # This workflow's bash runs without -e: stop on a failed build.
          set -eo pipefail
          if [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "PDYNAMO3_BUILD=cached" | tee -a platform-results.txt
          fi
          [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" == "true" ]] || python3 .github/scripts/patch_pdynamo3_windows.py pDynamo3 | tee -a platform-results.txt
          cd pDynamo3/installation
          if [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" != "true" ]]; then
            # Keep the whole log: compiler error cascades bury the first error.
            if ! python3 Install.py -f -q > ../../pdynamo3-build.log 2>&1; then
              first=$(grep -m1 -nE "error C[0-9]+|error LNK[0-9]+|fatal error|: error:|^error: " ../../pdynamo3-build.log | cut -d: -f1)
              echo "== pDynamo3 build: context before the first error (line $first)"
              sed -n "$(( first > 25 ? first - 25 : 1 )),$(( first + 15 ))p" ../../pdynamo3-build.log
              echo "== last lines"; tail -25 ../../pdynamo3-build.log
              exit 1
            fi
            tail -5 ../../pdynamo3-build.log
          fi
          cd ../..
          export PDYNAMO3_HOME="$PWD/pDynamo3"
          export PDYNAMO3_PARAMETERS="$PDYNAMO3_HOME/parameters"
          export PDYNAMO3_SCRATCH="$RUNNER_TEMP"
          PYTHONPATH="$PDYNAMO3_HOME" python3 -c "import pCore, pBabel, pMolecule, pScientific, pSimulation; print('PDYNAMO3_IMPORT=OK')" | tee -a platform-results.txt
          echo "PDYNAMO3_REF=$PDYNAMO3_REF" | tee -a platform-results.txt

      - name: Run the full EasyHybrid application with pDynamo3
        env:
          EASYHYBRID_RUN_FULL_APP_GRAPHICS: "1"
          EASYHYBRID_FULL_APP_CYCLES: "5"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          export PDYNAMO3_HOME="$PWD/pDynamo3"
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe PYOPENGL_USE_ACCELERATE=0 xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" python3 -m pytest -q -s -p no:cacheprovider tests/test_easyhybrid_full_app_smoke.py 2>&1 | tee -a platform-results.txt

      - name: Run 5 EasyHybrid molecular scene pick and close cycles
        env:
          EASYHYBRID_RUN_GRAPHICS_TESTS: "1"
          EASYHYBRID_TEST_COORDINATE_PICKING: "1"
          EASYHYBRID_GRAPHICS_SMOKE_CYCLES: "5"
          # The distro's optional Cython accelerator was built against its
          # packaged NumPy; the user-site NumPy needed by the renderer can
          # have a different C ABI. PyOpenGL's ctypes path is fully capable.
          PYOPENGL_USE_ACCELERATE: "0"
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" python3 -m pytest -q -s -p no:cacheprovider tests/test_gtk_icon_theme_smoke.py::test_easyhybrid_menu_vismol_components_open_and_close_cleanly 2>&1 | tee -a platform-results.txt

      - name: Validate VisMol rendering, export, picking and resize at scale 1 and 2
        env:
          EASYHYBRID_RUN_GRAPHICS_TESTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          EASYHYBRID_REQUIRE_HIDPI_RENDER: "1"
          PYOPENGL_USE_ACCELERATE: "0"
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" python3 -m pytest -q -s -p no:cacheprovider tests/test_vismol_render_validation.py 2>&1 | tee -a platform-results.txt

      - name: Upload runtime and test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gtk-${{ matrix.gtk }}-linux-x86_64-${{ matrix.distro }}-results
          path: platform-results.txt
          if-no-files-found: warn

  # conda-forge has no Windows GTK 4.16/4.18. Archived MSYS2 gtk4 binaries
  # do not load against current MSYS2 libraries (removed symbols, renamed
  # DLLs), so build the SHA-256-pinned GNOME release with current MSYS2
  # UCRT64 dependencies, then test with the same pinned Mesa renderer.
  gtk-windows-msys2:
    name: GTK ${{ matrix.gtk }} / windows-x86_64 (msys2 source ${{ matrix.version }})
    if: inputs.scope != 'windows-legacy' && inputs.scope != 'macos-diagnostic' && inputs.scope != 'macos-gtk424'
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - gtk: "4.16"
            version: 4.16.13
            sha256: ddf3d9e12b848139a945d191d5ca56b78d0647f53b55b8bca5f9902b61624498
          - gtk: "4.18"
            version: 4.18.6
            sha256: e1817c650ddc3261f9a8345b3b22a26a5d80af154630dedc03cc7becefffd0fa

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v5

      - name: Create MSYS2 UCRT64 build and Python runtime
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-graphene
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-sassc
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-pyopengl
            mingw-w64-ucrt-x86_64-python-pytest
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-cython
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-freetype-py
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-python-scipy
            mingw-w64-ucrt-x86_64-python-psutil
            mingw-w64-ucrt-x86_64-python-setuptools
            tar
            xz

      - name: Build and install GTK ${{ matrix.version }} from source
        run: |
          set -eo pipefail
          if pacman -Q mingw-w64-ucrt-x86_64-gtk4 >/dev/null 2>&1; then
            echo "A packaged GTK4 is installed; refusing to mix it with the source build." >&2
            exit 1
          fi
          curl -fsSL "https://download.gnome.org/sources/gtk/${{ matrix.gtk }}/gtk-${{ matrix.version }}.tar.xz" -o gtk.tar.xz
          echo "${{ matrix.sha256 }}  gtk.tar.xz" | sha256sum -c -
          tar -xJf gtk.tar.xz
          args=$(python .github/scripts/gtk_meson_options.py gtk-${{ matrix.version }} win32)
          echo "MESON_ARGS=$args"
          meson setup gtk-build gtk-${{ matrix.version }} --prefix="$MINGW_PREFIX" \
            --buildtype=release --wrap-mode=nofallback $args
          meson compile -C gtk-build
          meson install -C gtk-build

      - name: Install pinned Mesa WGL software renderer
        shell: pwsh
        run: |
          $pythonExe = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin\python.exe'
          & .github/scripts/install_mesa_wgl.ps1 -PythonExe $pythonExe

      - name: Record actual runtime and host
        run: |
          set -o pipefail
          printf 'GTK_REQUESTED=%s OS=windows-x86_64 PROVIDER=msys2-source-%s\n' '${{ matrix.gtk }}' '${{ matrix.version }}' > platform-results.txt
          python .github/scripts/record_runtime.py 'msys2-source-${{ matrix.version }}' '${{ matrix.version }}' | tee -a platform-results.txt

      - name: Run native GTK window, Gio action, and real GLArea smoke
        run: |
          set -o pipefail
          GALLIUM_DRIVER=llvmpipe python tests/test_gtk_icon_theme_smoke.py 2>&1 | tee -a platform-results.txt

      - name: Run GTK4 widget-pattern tests
        env:
          EASYHYBRID_REQUIRE_GTK_DISPLAY: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          GALLIUM_DRIVER=llvmpipe python -m pytest -q -p no:cacheprovider --noconftest -rs tests/test_gtk4_widget_patterns.py 2>&1 | tee -a platform-results.txt

      - name: Build graphics engine extensions
        run: python setup.py build_ext --inplace
        working-directory: src/graphics_engine

      - name: Restore pDynamo3 build
        id: pdynamo3-cache
        uses: actions/cache@v4
        with:
          path: pDynamo3
          # One build per identical environment; saved only after a green job.
          key: pdynamo3-${{ env.PDYNAMO3_REF }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gtk }}-${{ matrix.distro || matrix.version || 'conda' }}-v12

      - name: Check out pinned pDynamo3
        if: steps.pdynamo3-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PDYNAMO3_REPOSITORY }}
          ref: ${{ env.PDYNAMO3_REF }}
          path: pDynamo3

      - name: Build pDynamo3
        run: |
          # This workflow's bash runs without -e: stop on a failed build.
          set -eo pipefail
          if [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "PDYNAMO3_BUILD=cached" | tee -a platform-results.txt
          fi
          [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" == "true" ]] || python .github/scripts/patch_pdynamo3_windows.py pDynamo3 | tee -a platform-results.txt
          cd pDynamo3/installation
          if [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" != "true" ]]; then
            # Keep the whole log: compiler error cascades bury the first error.
            if ! python Install.py -f -q > ../../pdynamo3-build.log 2>&1; then
              first=$(grep -m1 -nE "error C[0-9]+|error LNK[0-9]+|fatal error|: error:|^error: " ../../pdynamo3-build.log | cut -d: -f1)
              echo "== pDynamo3 build: context before the first error (line $first)"
              sed -n "$(( first > 25 ? first - 25 : 1 )),$(( first + 15 ))p" ../../pdynamo3-build.log
              echo "== last lines"; tail -25 ../../pdynamo3-build.log
              exit 1
            fi
            tail -5 ../../pdynamo3-build.log
          fi
          cd ../..
          export PDYNAMO3_HOME="$(cygpath -m "$PWD/pDynamo3")"
          export PDYNAMO3_PARAMETERS="$PDYNAMO3_HOME/parameters"
          export PDYNAMO3_SCRATCH="$RUNNER_TEMP"
          PYTHONPATH="$PDYNAMO3_HOME" python -c "import pCore, pBabel, pMolecule, pScientific, pSimulation; print('PDYNAMO3_IMPORT=OK')" | tee -a platform-results.txt
          echo "PDYNAMO3_REF=$PDYNAMO3_REF" | tee -a platform-results.txt

      - name: Run the full EasyHybrid application with pDynamo3
        env:
          EASYHYBRID_RUN_FULL_APP_GRAPHICS: "1"
          EASYHYBRID_FULL_APP_CYCLES: "5"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          export PDYNAMO3_HOME="$(cygpath -m "$PWD/pDynamo3")"
          GALLIUM_DRIVER=llvmpipe python -m pytest -q -s -p no:cacheprovider tests/test_easyhybrid_full_app_smoke.py 2>&1 | tee -a platform-results.txt

      - name: Run 5 EasyHybrid molecular scene pick and close cycles
        env:
          EASYHYBRID_RUN_GRAPHICS_TESTS: "1"
          EASYHYBRID_TEST_COORDINATE_PICKING: "1"
          EASYHYBRID_GRAPHICS_SMOKE_CYCLES: "5"
        run: |
          set -o pipefail
          GALLIUM_DRIVER=llvmpipe python -m pytest -q -s -p no:cacheprovider tests/test_gtk_icon_theme_smoke.py::test_easyhybrid_menu_vismol_components_open_and_close_cleanly 2>&1 | tee -a platform-results.txt

      - name: Validate VisMol rendering, export, picking and resize at scale 1 and 2
        env:
          EASYHYBRID_RUN_GRAPHICS_TESTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          GALLIUM_DRIVER=llvmpipe python -m pytest -q -s -p no:cacheprovider tests/test_vismol_render_validation.py 2>&1 | tee -a platform-results.txt

      - name: Reject native Windows fatal exceptions in GTK logs
        if: always()
        run: |
          if grep -Eq 'Windows fatal exception|unknown error ; error code 1073741819' platform-results.txt; then
            echo 'GTK emitted a native Windows fatal exception even though pytest may have exited successfully.'
            exit 1
          fi

      - name: Native backtrace of a widget-test crash (diagnostic)
        # Python's faulthandler cannot read the C stack on Windows. Re-run
        # under gdb (up to three times; crashes may be intermittent) and
        # print every thread's native frames. Diagnostic only: the failed
        # test step above already decides the job result.
        if: failure()
        env:
          EASYHYBRID_REQUIRE_GTK_DISPLAY: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gdb > /dev/null
          for attempt in 1 2 3; do
            echo "=== gdb attempt $attempt"
            GALLIUM_DRIVER=llvmpipe gdb -q -batch -ex "set pagination off" -ex run \
              -ex "thread apply all bt 30" \
              --args python -X faulthandler -m pytest -q -p no:cacheprovider --noconftest -x tests/test_gtk4_widget_patterns.py \
              > gdb-attempt.txt 2>&1 || true
            if grep -q "received signal" gdb-attempt.txt; then
              grep -A400 "received signal" gdb-attempt.txt | grep -E "received signal|^#|^Thread" | head -150
              break
            fi
            tail -3 gdb-attempt.txt
          done

      - name: Upload runtime and test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gtk-${{ matrix.gtk }}-windows-x86_64-results
          path: platform-results.txt
          if-no-files-found: warn

  # No Apple Silicon binaries exist for these GTK minors, so build the
  # official GNOME release tarball (SHA-256 pinned) against conda-forge
  # dependencies on the native arm64 runner.
  gtk-macos-source:
    name: GTK ${{ matrix.gtk }} / macos-arm64 (source ${{ matrix.version }})
    if: inputs.scope != 'windows-legacy' && inputs.scope != 'windows' && inputs.scope != 'macos-gtk424'
    runs-on: macos-14
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - gtk: "4.8"
            version: 4.8.3
            sha256: b362f968d085b4d3d9340d4d38c706377ded9d5374e694a2b6b7e6292e3cba74
          - gtk: "4.10"
            version: 4.10.5
            sha256: 9bd5e437e41d48e3d6a224c336b0fd3fd490036dceb8956ed74b956369af609b
          - gtk: "4.16"
            version: 4.16.13
            sha256: ddf3d9e12b848139a945d191d5ca56b78d0647f53b55b8bca5f9902b61624498
          - gtk: "4.18"
            version: 4.18.6
            sha256: e1817c650ddc3261f9a8345b3b22a26a5d80af154630dedc03cc7becefffd0fa

    defaults:
      run:
        shell: bash {0}

    steps:
      - uses: actions/checkout@v5

      - name: Create GTK build dependencies
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          micromamba-version: 2.9.0-0
          environment-name: easyhybrid-gtk-src
          cache-environment: true
          init-shell: none
          post-cleanup: none
          create-args: >-
            python=3.12
            numpy
            cython
            pillow
            freetype-py
            pyyaml
            scipy
            psutil
            setuptools
            pygobject
            pycairo
            pyopengl
            pytest
            meson
            ninja
            pkg-config
            gobject-introspection
            glib
            cairo
            pango
            harfbuzz
            fribidi
            libgraphene
            epoxy
            gdk-pixbuf
            libpng
            libjpeg-turbo
            libtiff
            zlib
            expat
            freetype
            fontconfig
            pixman
            gettext
            sassc
            adwaita-icon-theme
            hicolor-icon-theme

      - name: Build and install GTK ${{ matrix.version }} from source
        run: |
          set -eo pipefail
          minor='${{ matrix.gtk }}'
          curl -fsSL "https://download.gnome.org/sources/gtk/${minor}/gtk-${{ matrix.version }}.tar.xz" -o gtk.tar.xz
          echo "${{ matrix.sha256 }}  gtk.tar.xz" | shasum -a 256 -c -
          tar -xJf gtk.tar.xz
          micromamba run -n easyhybrid-gtk-src bash -eo pipefail -c '
            args=$(python .github/scripts/gtk_meson_options.py gtk-${{ matrix.version }})
            echo "MESON_ARGS=$args"
            export LDFLAGS="-Wl,-rpath,$CONDA_PREFIX/lib ${LDFLAGS:-}"
            meson setup gtk-build gtk-${{ matrix.version }} --prefix="$CONDA_PREFIX" --libdir=lib \
              --buildtype=release --wrap-mode=nofallback $args
            meson compile -C gtk-build
            meson install -C gtk-build
          '

      - name: Record actual runtime and host
        run: |
          set -o pipefail
          printf 'GTK_REQUESTED=%s OS=macos-arm64 PROVIDER=source-%s\n' '${{ matrix.gtk }}' '${{ matrix.version }}' > platform-results.txt
          micromamba run -n easyhybrid-gtk-src python .github/scripts/record_runtime.py 'source-${{ matrix.version }}' '${{ matrix.version }}' | tee -a platform-results.txt

      - name: Run native GTK window, Gio action, and real GLArea smoke
        run: |
          set -o pipefail
          micromamba run -n easyhybrid-gtk-src python tests/test_gtk_icon_theme_smoke.py 2>&1 | tee -a platform-results.txt

      - name: Run GTK4 widget-pattern tests
        env:
          EASYHYBRID_REQUIRE_GTK_DISPLAY: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          micromamba run -n easyhybrid-gtk-src python -m pytest -q -p no:cacheprovider --noconftest -rs tests/test_gtk4_widget_patterns.py 2>&1 | tee -a platform-results.txt

      - name: Build graphics engine extensions
        run: micromamba run -n easyhybrid-gtk-src python setup.py build_ext --inplace
        working-directory: src/graphics_engine

      - name: Restore pDynamo3 build
        id: pdynamo3-cache
        uses: actions/cache@v4
        with:
          path: pDynamo3
          # One build per identical environment; saved only after a green job.
          key: pdynamo3-${{ env.PDYNAMO3_REF }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gtk }}-${{ matrix.distro || matrix.version || 'conda' }}-v12

      - name: Check out pinned pDynamo3
        if: steps.pdynamo3-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PDYNAMO3_REPOSITORY }}
          ref: ${{ env.PDYNAMO3_REF }}
          path: pDynamo3

      - name: Build pDynamo3
        run: |
          # This workflow's bash runs without -e: stop on a failed build.
          set -eo pipefail
          if [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "PDYNAMO3_BUILD=cached" | tee -a platform-results.txt
          fi
          [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" == "true" ]] || micromamba run -n easyhybrid-gtk-src python .github/scripts/patch_pdynamo3_windows.py pDynamo3 | tee -a platform-results.txt
          cd pDynamo3/installation
          if [[ "${{ steps.pdynamo3-cache.outputs.cache-hit }}" != "true" ]]; then
            # Keep the whole log: compiler error cascades bury the first error.
            if ! micromamba run -n easyhybrid-gtk-src python Install.py -f -q > ../../pdynamo3-build.log 2>&1; then
              first=$(grep -m1 -nE "error C[0-9]+|error LNK[0-9]+|fatal error|: error:|^error: " ../../pdynamo3-build.log | cut -d: -f1)
              echo "== pDynamo3 build: context before the first error (line $first)"
              sed -n "$(( first > 25 ? first - 25 : 1 )),$(( first + 15 ))p" ../../pdynamo3-build.log
              echo "== last lines"; tail -25 ../../pdynamo3-build.log
              exit 1
            fi
            tail -5 ../../pdynamo3-build.log
          fi
          cd ../..
          export PDYNAMO3_HOME="${{ github.workspace }}/pDynamo3"
          export PDYNAMO3_PARAMETERS="$PDYNAMO3_HOME/parameters"
          export PDYNAMO3_SCRATCH="$RUNNER_TEMP"
          PYTHONPATH="$PDYNAMO3_HOME" micromamba run -n easyhybrid-gtk-src python -c "import pCore, pBabel, pMolecule, pScientific, pSimulation; print('PDYNAMO3_IMPORT=OK')" | tee -a platform-results.txt
          echo "PDYNAMO3_REF=$PDYNAMO3_REF" | tee -a platform-results.txt

      - name: Run the full EasyHybrid application with pDynamo3
        env:
          EASYHYBRID_RUN_FULL_APP_GRAPHICS: "1"
          EASYHYBRID_FULL_APP_CYCLES: "5"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          export PDYNAMO3_HOME="${{ github.workspace }}/pDynamo3"
          micromamba run -n easyhybrid-gtk-src python -m pytest -q -s -p no:cacheprovider tests/test_easyhybrid_full_app_smoke.py 2>&1 | tee -a platform-results.txt

      - name: Run 5 EasyHybrid molecular scene pick and close cycles
        env:
          EASYHYBRID_RUN_GRAPHICS_TESTS: "1"
          EASYHYBRID_TEST_COORDINATE_PICKING: "1"
          EASYHYBRID_GRAPHICS_SMOKE_CYCLES: "5"
          EASYHYBRID_DEBUG_PICK: "1"
        # Keep the scene/pick evidence in the uploaded artifact like the
        # other providers; this step previously wrote only to the job log.
        run: |
          set -o pipefail
          micromamba run -n easyhybrid-gtk-src python -m pytest -q -s -p no:cacheprovider tests/test_gtk_icon_theme_smoke.py::test_easyhybrid_menu_vismol_components_open_and_close_cleanly 2>&1 | tee -a platform-results.txt

      - name: Validate VisMol rendering, export, picking and resize at scale 1 and 2
        env:
          EASYHYBRID_RUN_GRAPHICS_TESTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          micromamba run -n easyhybrid-gtk-src python -m pytest -q -s -p no:cacheprovider tests/test_vismol_render_validation.py 2>&1 | tee -a platform-results.txt

      - name: Show macOS native crash report
        if: failure() && runner.os == 'macOS'
        run: python3 .github/scripts/show_macos_crash_report.py

      - name: Upload runtime and test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gtk-${{ matrix.gtk }}-macos-arm64-results
          path: platform-results.txt
          if-no-files-found: warn
