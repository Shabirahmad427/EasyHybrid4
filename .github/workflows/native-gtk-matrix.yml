name: Native GTK4 compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gtk-runtime:
    name: GTK ${{ matrix.gtk }} / ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        os: [linux-x86_64, windows-x86_64, macos-arm64]
        include:
          - os: linux-x86_64
            runner: ubuntu-24.04
          - os: windows-x86_64
            runner: windows-2022
          - os: macos-arm64
            runner: macos-14
        gtk: ["4.8", "4.10", "4.12", "4.14", "4.16", "4.18", "4.20", "4.22", "4.24"]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native display and software GL support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri

      - name: Create GTK runtime
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: easyhybrid-gtk
          cache-environment: true
          create-args: >-
            python=3.12
            gtk4=${{ matrix.gtk }}.*
            ${{ matrix.gtk == '4.8' && 'jpeg=9e' || '' }}
            pygobject
            pycairo
            pytest
            pyopengl

      - name: Install software OpenGL provider for Windows runner
        if: runner.os == 'Windows'
        run: micromamba install --yes -n easyhybrid-gtk --channel conda-forge mesalib

      - name: Install full regression dependencies
        if: matrix.gtk == '4.24'
        run: >-
          micromamba install --yes -n easyhybrid-gtk --channel conda-forge
          numpy scipy cython pillow freetype-py psutil pyyaml

      - name: Record actual runtime and host
        run: |
          python -c 'import gi, platform; from gi.repository import GLib, Gtk; print("OS=%s ARCH=%s PYTHON=%s PYGOBJECT=%s GTK=%s GLIB=%s" % (platform.platform(), platform.machine(), platform.python_version(), ".".join(map(str, gi.version_info)), ".".join(map(str, (Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version()))), ".".join(map(str, (GLib.MAJOR_VERSION, GLib.MINOR_VERSION, GLib.MICRO_VERSION))))' | tee platform-results.txt

      - name: Run native GTK window, Gio action, and real GLArea smoke
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" python tests/test_gtk_icon_theme_smoke.py 2>&1 | tee -a platform-results.txt
          else
            python tests/test_gtk_icon_theme_smoke.py 2>&1 | tee -a platform-results.txt
          fi

      - name: Build graphics engine extensions
        if: matrix.gtk == '4.24'
        run: python setup.py build_ext --inplace
        working-directory: src/graphics_engine

      - name: Run complete regression suite with real GTK smoke enabled
        if: matrix.gtk == '4.24'
        env:
          EASYHYBRID_RUN_GTK_GUI_TESTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" python -m pytest -q -p no:cacheprovider tests/ 2>&1 | tee -a platform-results.txt
          else
            python -m pytest -q -p no:cacheprovider tests/ 2>&1 | tee -a platform-results.txt
          fi

      - name: Upload runtime and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-${{ matrix.gtk }}-${{ matrix.os }}-results
          path: platform-results.txt
          if-no-files-found: warn
